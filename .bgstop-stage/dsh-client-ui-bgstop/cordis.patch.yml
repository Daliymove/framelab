# dsh-client-ui-bgstop bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); the node half (exports ".") registers the /api/dsh-bgstop
# routes in the host process, and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client") load in the web GUI.
- insert:
    - id: ui-bgstop
      name: '@linxin666/dsh-client-ui-bgstop'
